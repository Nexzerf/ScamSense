name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine, server, app render and flow tests
        run: ./gradlew :core:test :server:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew lintRelease
      - name: Build APKs and server jar
        run: ./gradlew :app:assembleDebug :app:assembleRelease :server:fatJar
      - uses: actions/upload-artifact@v4
        with:
          name: scamsense-apks
          path: |
            app/build/outputs/apk/**/*.apk
            server/build/libs/scamsense-server.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
